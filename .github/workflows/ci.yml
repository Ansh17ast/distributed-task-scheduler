name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Core Unit & Component Tests
        run: go test -v -race -timeout 120s ./internal/config ./internal/dag ./internal/domain ./internal/scheduler

      - name: Build Coordinator & Worker Binaries
        run: |
          mkdir -p bin
          go build -v -o bin/coordinator ./cmd/coordinator
          go build -v -o bin/worker ./cmd/worker
